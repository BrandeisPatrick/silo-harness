<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/@harness/harness.css">
<style>
  /* As in Claude Code's Context section: the slices are coloured by size (blue, orange, green, then greys), the
     autocompact buffer a darker grey, the free space the bar's own track */
  :root {
    --c-1: #2a7edf; --c-2: #e8742f; --c-3: #18a586; --c-grey: #878787; --c-buffer: #c2c2c2;
    --track: rgba(0, 0, 0, 0.06);
  }
  :root[data-theme="dark"] {
    --c-1: #4c7ce7; --c-2: #cf6622; --c-3: #439b7f; --c-grey: #8a8a8a; --c-buffer: #535353;
    --track: rgba(255, 255, 255, 0.07);
  }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-height: 24px; }
  .pct { color: var(--text-100); font-variant-numeric: tabular-nums; }
  .top.warn .pct { color: var(--warn); }
  .top.danger .pct { color: var(--danger); }
  .sum { color: var(--text-400); font-variant-numeric: tabular-nums; }
  /* A 4 px rounded bar of segments, 1 px of track between them */
  .bar { display: flex; gap: 1px; height: 4px; margin: 4px 0 8px; border-radius: 2px; overflow: hidden; background: var(--track); }
  .bar > span { flex: none; height: 100%; min-width: 2px; background: var(--seg); transition: width 0.3s ease; }
  /* The legend: a dense table at the secondary size on 24 px rows */
  .list { margin: 0; padding: 0; list-style: none; font-size: var(--fs-small); line-height: var(--lh-small); }
  .list + .list { margin-top: 8px; }
  .row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 48px; align-items: center; column-gap: 12px; min-height: 24px; color: var(--text-200); }
  .sq { width: 10px; height: 10px; border-radius: 2px; background: var(--seg); }
  .row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .name.more { text-decoration: underline dotted; text-decoration-color: var(--text-400); text-underline-offset: 3px; }
  .row .tok { color: var(--text-400); }
  .row .per { color: var(--text-100); font-weight: 500; }
  /* What is behind a number: a chevron row per slice, its entries under it when open */
  .fold { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; column-gap: 12px; width: 100%; min-height: 24px; text-align: left; color: var(--text-200); border-radius: var(--r-control); }
  .fold:hover { color: var(--text-100); }
  .fold .h-chev { width: 12px; height: 12px; margin-left: -1px; color: var(--text-400); transition: transform 0.15s ease; }
  .fold[aria-expanded="true"] .h-chev { transform: rotate(90deg); }
  .fold .cnt { color: var(--text-400); }
  .items { margin: 0 0 4px; padding: 0; list-style: none; }
  .items li { display: grid; grid-template-columns: minmax(0, 1fr) auto 48px; column-gap: 12px; min-height: 24px; align-items: center; padding-left: 22px; color: var(--text-400); }
  .items li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot { margin: 12px 0 0; color: var(--text-400); }
  /* One row when the rail is wide enough; at narrower widths the button moves under the note instead of cutting it */
  .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; margin-top: 12px; }
  .actions .h-muted { white-space: nowrap; }
  .actions .h-btn { flex: none; margin-left: auto; padding: 0 8px; }
  .error { margin-top: 6px; color: var(--danger); font-size: var(--fs-small); line-height: var(--lh-small); }
</style>
</head>
<body>
<div id="root" hidden>
  <div class="top" id="top"><span class="pct" id="pct"></span><span class="sum" id="sum"></span></div>
  <div class="bar" id="bar" role="img"></div>
  <ul class="list" id="slices"></ul>
  <ul class="list" id="folds"></ul>
  <p class="h-muted foot" id="foot"></p>
  <div class="actions">
    <span class="h-muted" id="auto"></span>
    <button class="h-btn primary sm" id="compact">Compact session</button>
  </div>
  <div class="error" id="error" hidden></div>
</div>
<p class="h-empty" id="empty" hidden>No context numbers yet.</p>
<script src="/@harness/harness.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const CHEV = '<svg class="h-icon h-chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.25 3.75L10.5 8l-4.25 4.25"/></svg>';
  const LABELS = { reserve: 'Autocompact buffer', free: 'Free space' };
  let ctx = null;
  let running = false;
  let compacting = false;
  let error = '';
  const open = new Set();

  function fmtTokens(n) {
    n = Math.max(0, Math.round(Number(n) || 0));
    if (n < 1000) return String(n);
    const k = n / 1000;
    if (k < 999.95) return `${Math.round(k * 10) / 10}k`;
    const m = n / 1e6;
    return m < 9.95 ? `${Math.round(m * 10) / 10}M` : `${Math.round(m)}M`;
  }
  /** Whole thousands from 10k up: "170k until auto-compact" */
  function fmtRound(n) {
    n = Math.max(0, Math.round(Number(n) || 0));
    return n >= 10000 && n < 1e6 ? `${Math.round(n / 1000)}k` : fmtTokens(n);
  }
  function fmtPct(r) {
    const p = (Number(r) || 0) * 100;
    if (p <= 0) return '0%';
    if (p < 0.05) return '<0.1%';
    return `${(Math.round(p * 10) / 10).toFixed(1)}%`;
  }
  function usedPct(r) {
    const p = (Number(r) || 0) * 100;
    return p <= 0 ? '0%' : p < 1 ? '<1%' : `${Math.round(p)}%`;
  }
  function ago(t) {
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 45) return 'just now';
    const m = Math.round(s / 60);
    if (m < 60) return m <= 1 ? '1 minute ago' : `${m} minutes ago`;
    const h = Math.round(m / 60);
    if (h < 24) return h === 1 ? '1 hour ago' : `${h} hours ago`;
    const d = Math.round(h / 24);
    return d === 1 ? 'yesterday' : `${d} days ago`;
  }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

  // The app says whether compacting now could free anything (false while a run is going or for a short conversation)
  const compactable = () => !!(ctx && ctx.compactable === true);

  /** Used slices largest first, then the buffer, then free space; the three largest in colour, the rest grey */
  function ordered(slices) {
    const used = slices.filter((s) => s.key !== 'reserve' && s.key !== 'free').sort((a, b) => (b.tokens || 0) - (a.tokens || 0));
    let rank = 0;
    const out = used.map((s) => ({ ...s, colour: s.tokens > 0 && rank < 3 ? `var(--c-${++rank})` : 'var(--c-grey)' }));
    for (const key of ['reserve', 'free']) {
      const s = slices.find((x) => x.key === key);
      if (s) out.push({ ...s, label: LABELS[key], colour: key === 'reserve' ? 'var(--c-buffer)' : 'var(--track)' });
    }
    return out;
  }

  function render() {
    const ok = !!(ctx && ctx.limit > 0);
    $('root').hidden = !ok;
    $('empty').hidden = ok;
    if (!ok) return;
    const limit = ctx.limit;
    const used = ctx.tokens || 0;
    const ratio = used / limit;
    const threshold = typeof ctx.threshold === 'number' ? ctx.threshold : 0.8;
    $('pct').textContent = `${usedPct(ratio)} used`;
    $('sum').textContent = `${fmtTokens(used)} / ${fmtTokens(limit)}`;
    $('top').classList.toggle('danger', ratio >= threshold);
    $('top').classList.toggle('warn', ratio < threshold && ratio >= threshold - 0.1);

    const slices = ordered(Array.isArray(ctx.slices) ? ctx.slices : []);
    const bar = $('bar');
    bar.textContent = '';
    bar.setAttribute('aria-label', `${usedPct(ratio)} of the context window used`);
    for (const s of slices) {
      if (s.key === 'free' || !(s.tokens > 0)) continue;
      const seg = el('span');
      seg.style.width = `${Math.min(100, (s.tokens / limit) * 100)}%`;
      seg.style.setProperty('--seg', s.colour);
      seg.title = `${s.label}: ${fmtTokens(s.tokens)}`;
      bar.appendChild(seg);
    }

    const list = $('slices');
    list.textContent = '';
    const folds = [];
    for (const s of slices) {
      const items = Array.isArray(s.items) && s.items.length ? s.items : null;
      if (items) folds.push({ ...s, items });
      const li = el('li', 'row');
      li.dataset.key = s.key;
      const sq = el('span', 'sq');
      sq.style.setProperty('--seg', s.colour);
      const name = el('span', 'name' + (items ? ' more' : ''), s.label || s.key);
      name.title = items ? items.map((it) => `${it.label}  ${fmtTokens(it.tokens)}`).join('\n') : s.label || s.key;
      li.append(sq, name, el('span', 'num tok', fmtTokens(s.tokens)), el('span', 'num per', fmtPct(s.tokens / limit)));
      list.appendChild(li);
    }

    const fl = $('folds');
    fl.textContent = '';
    fl.hidden = !folds.length;
    for (const s of folds) {
      const li = el('li');
      const btn = el('button', 'fold');
      btn.dataset.key = s.key;
      btn.setAttribute('aria-expanded', String(open.has(s.key)));
      btn.insertAdjacentHTML('beforeend', CHEV);
      btn.append(el('span', 'name', s.label || s.key), el('span', 'num cnt', String(s.items.length)));
      btn.onclick = () => { open.has(s.key) ? open.delete(s.key) : open.add(s.key); render(); };
      li.appendChild(btn);
      if (open.has(s.key)) {
        const ul = el('ul', 'items');
        for (const it of s.items) {
          const sub = el('li');
          const a = el('span', '', it.label); a.title = it.label;
          sub.append(a, el('span', 'num', fmtTokens(it.tokens)), el('span', 'num', fmtPct(it.tokens / limit)));
          ul.appendChild(sub);
        }
        li.appendChild(ul);
      }
      fl.appendChild(li);
    }

    const btn = $('compact');
    btn.disabled = running || compacting || !compactable();
    btn.textContent = compacting ? 'Compacting…' : 'Compact session';
    btn.title = running ? 'Wait for the run' : !compactable() ? 'Nothing to compact yet' : 'Summarise to free up room';
    const left = Math.round(limit * threshold) - used;
    $('auto').textContent = ctx.autoCompact === false ? 'Auto-compact off' : left > 0 ? `${fmtRound(left)} until auto-compact` : 'Auto-compacts on the next turn';
    $('auto').title = ctx.autoCompact === false ? 'Turn it on in Settings → Context' : `Compacts at ${Math.round(threshold * 100)}% full`;
    $('error').hidden = !error;
    $('error').textContent = error;
    renderFoot();
  }

  function renderFoot() {
    if (!ctx) return;
    const when = ctx.updatedAt ? `Last updated ${ago(ctx.updatedAt)}` : 'Not measured yet';
    $('foot').textContent = `${when}${ctx.basis === 'estimated' ? ' · estimated' : ''}`;
  }

  async function loadContext() {
    try { ctx = await harness.session.context(); } catch (e) { ctx = null; }
    render();
  }
  async function load() {
    const s = await harness.session.get().catch(() => null);
    running = !!(s && s.running);
    lastId = s && s.id;
    error = '';
    await loadContext();
  }

  $('compact').onclick = async () => {
    compacting = true;
    error = '';
    render();
    try {
      const r = await harness.session.compact();
      if (r && r.ok === false) error = r.error || 'Could not compact.';
    } catch (e) {
      error = e.message;
    }
    compacting = false;
    await loadContext();
  };

  harness.on('context.changed', loadContext);
  harness.on('run.started', () => { running = true; error = ''; render(); });
  harness.on('run.ended', () => { running = false; loadContext(); });
  harness.on('session.changed', (s) => {
    const switched = !ctx || !s || (lastId && s.id !== lastId);
    lastId = s && s.id;
    running = !!(s && s.running);
    if (switched) { open.clear(); error = ''; loadContext(); } else render();
  });
  let lastId = null;
  harness.ready.then(load);
  setInterval(renderFoot, 30000);
</script>
</body>
</html>
